<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" role="img" aria-label="stefumies - coder, ai explorer, software curmudgeon">
  <style>
    /* Clean, modern sans-serif for the name */
    .brand { 
      fill: currentColor; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      font-weight: 800; 
      font-size: 52px; 
      letter-spacing: -1.5px;
    }
    /* Monospace for the technical subline */
    .subline { 
      fill: currentColor; 
      fill-opacity: 0.7;
      font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace; 
      font-size: 15px; 
      letter-spacing: 0.5px;
    }
    .divider { 
      stroke: currentColor; 
      stroke-width: 2; 
      stroke-linecap: round;
      opacity: 0.3;
    }
  </style>

  <text x="0" y="55" class="brand">stefumies</text>
  
  <line x1="0" y1="75" x2="435" y2="75" class="divider" />
  
  <text x="0" y="100" class="subline">coder • ai explorer • software curmudgeon</text>
</svg>
